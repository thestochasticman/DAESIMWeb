services:
  backend:
    user: "1001:1001"
    ports:
      - "2000:2000"
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: daesim-backend
    # Runtime settings that do not depend on the deployment (PATH, HOME, GDAL,
    # python flags, the uvicorn CMD) live in backend/Dockerfile. No `command:`
    # override: the CMD runs uvicorn without --reload, since a reload would
    # kill in-flight model runs.
    environment:
      ALLOWED_ORIGINS: "http://localhost:2000,http://127.0.0.1:2000"
      # The three packages come from volume-mounted checkouts (edit + restart,
      # no rebuild). DAESIM is on its `yasar` branch (vectorised hot paths).
      PYTHONPATH: /borevitz_projects/repos/paddocktimeseries:/borevitz_projects/repos/DAESIM/src:/borevitz_projects/repos/daesim2-analysis/src
      # troi config via env (no TROI_CONFIG file). Outputs are DAESIM's own;
      # tmp points at PaddockTSWeb so the machine-wide SILO/OzWALD stores are shared.
      DAESIM_STATIC_DIR: /borevitz_projects/data
      DAESIM_MAX_WORKERS: "2"
      TROI_OUTDIR: /borevitz_projects/data/DAESIMWeb/troi
      TROI_TMPDIR: /borevitz_projects/data/PaddockTSWeb
      TROI_EMAIL: yasaradeel@gmail.com
    volumes:
      # Code and the conda env are read-only: the container must never write
      # into the shared host environment. Only the data volume is writable.
      - /borevitz_projects/repos/paddocktimeseries:/borevitz_projects/repos/paddocktimeseries:ro
      - /borevitz_projects/repos/DAESIM:/borevitz_projects/repos/DAESIM:ro
      - /borevitz_projects/repos/daesim2-analysis:/borevitz_projects/repos/daesim2-analysis:ro
      - ./backend:/app:ro
      - /borevitz_projects/data/:/borevitz_projects/data/
      - /borevitz_projects/dev/tools/miniconda3/:/opt/conda/:ro
      # Also at the host path: pip packages bake absolute install paths into
      # the env (e.g. cv2/config-3.11.py), which must resolve here too.
      - /borevitz_projects/dev/tools/miniconda3/:/borevitz_projects/dev/tools/miniconda3/:ro
    restart: always
    networks:
      - edge

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /DAESIM/api
        NEXT_BASEPATH: /DAESIM
    container_name: daesim-frontend
    environment:
      NODE_ENV: production
    restart: always
    networks:
      - edge

networks:
  edge:
    external: true
