services:
  backend:
    user: "1001:1001"
    ports:
      - "2000:2000"
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: daesim-backend
    environment:
      HOME: /tmp
      # uid 1001 has no /etc/passwd entry in the image; some libs fall back to $USER.
      USER: yasar
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: Agg
      # Use ONLY the conda env's packages; never a host user-site (~/.local).
      PYTHONNOUSERSITE: "1"
      ALLOWED_ORIGINS: "http://localhost:2000,http://127.0.0.1:2000"
      HDF5_USE_FILE_LOCKING: "FALSE"
      # paddocktimeseries (PaddockTS 1.x) needs Python >= 3.11 -> paddockts-env.
      PATH: /opt/conda/envs/paddockts-env/bin:/opt/conda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      GDAL_DATA: /opt/conda/envs/paddockts-env/share/gdal
      PROJ_LIB: /opt/conda/envs/paddockts-env/share/proj
      # The three packages come from volume-mounted checkouts (edit + restart,
      # no rebuild). DAESIM is on its `yasar` branch (vectorised hot paths).
      PYTHONPATH: /borevitz_projects/repos/paddocktimeseries:/borevitz_projects/repos/DAESIM/src:/borevitz_projects/repos/daesim2-analysis/src
      # troi config via env (no TROI_CONFIG file). Outputs are DAESIM's own;
      # tmp points at PaddockTSWeb so the machine-wide SILO/OzWALD stores are shared.
      DAESIM_STATIC_DIR: /borevitz_projects/data
      TROI_OUTDIR: /borevitz_projects/data/DAESIMWeb/troi
      TROI_TMPDIR: /borevitz_projects/data/PaddockTSWeb
      TROI_EMAIL: yasaradeel@gmail.com
    volumes:
      - /borevitz_projects/repos/paddocktimeseries:/borevitz_projects/repos/paddocktimeseries
      - /borevitz_projects/repos/DAESIM:/borevitz_projects/repos/DAESIM
      - /borevitz_projects/repos/daesim2-analysis:/borevitz_projects/repos/daesim2-analysis
      - ./backend:/app
      - /borevitz_projects/data/:/borevitz_projects/data/
      - /borevitz_projects/dev/tools/miniconda3/:/opt/conda/
      # Also at the host path: pip packages bake absolute install paths into
      # the env (e.g. cv2/config-3.11.py), which must resolve here too.
      - /borevitz_projects/dev/tools/miniconda3/:/borevitz_projects/dev/tools/miniconda3/
    command: python -m uvicorn main:app --host 0.0.0.0 --port 2000 --reload
    restart: always
    networks:
      - edge

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /DAESIM/api
        NEXT_BASEPATH: /DAESIM
    container_name: daesim-frontend
    environment:
      NODE_ENV: production
    restart: always
    networks:
      - edge

networks:
  edge:
    external: true
